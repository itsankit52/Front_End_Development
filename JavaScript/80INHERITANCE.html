<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance</title>
</head>

<body>
    <h1>Inheritance in js</h1>
    <p>Inheritance allows one class to acquire properties and methods of another class.</p>


    <script>
        class Animal {
            eat() {
                console.log("Animals are eating:");
            }
        }

        class Dog extends Animal {
            bark() {
                console.log("Dogs are barking:");
            }
        }

        const d = new Dog();
        d.eat();   // From parent 
        d.bark();  // Own methods 

    </script>
</body>

</html>
